services:
  app:
    build: .
    env_file: .env.staging
    environment:
      APP_ENV: staging
      STORAGE_DIR: /data
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: staging_v1
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag_data:/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  qdrant:
    image: ${QDRANT_IMAGE:?Set a tested versioned QDRANT_IMAGE in .env.staging}
    volumes:
      - qdrant_staging:/qdrant/storage
    restart: unless-stopped
  ollama:
    image: ${OLLAMA_IMAGE:?Set a tested versioned OLLAMA_IMAGE in .env.staging}
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
volumes:
  rag_data:
  qdrant_staging:
  ollama_models:
